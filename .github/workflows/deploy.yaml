name: Deploy

# main deploys the production Worker (lesterbarahona.com).
# Every other branch deploys the preview Worker, which search engines are told not to index.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'production' || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_MODE: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy ${{ github.ref_name != 'main' && '--env preview' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
